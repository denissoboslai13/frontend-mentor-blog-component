<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossoriginyy>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="bg-[#f4d04e] font-[Figtree]">
  <main>
    <div class="flex flex-col w-100% text-center justify-center h-[98vh] p-4 items-center">
      <div class="flex flex-col text-left bg-white p-5 border-[1px] border-black rounded-2xl w-full max-w-[370px] gap-3 shadow-[8px_8px_0_0_rgb(0,0,0)]">
        <div class="mb-3 w-full h-[200px] overflow-hidden rounded-xl">
          <img src="assets/images/illustration-article.svg" class="w-full h-full object-cover object-center" alt="illustration-article">
        </div>
        <div class="flex flex-col gap-3">
          <div class="bg-[#f4d04e] w-min px-3 py-1 font-extrabold rounded-[0.25rem] text-xs">
            Learning
          </div>
          <div class="text-[0.8rem] text-[#121212] font-medium">
            Published 21 Dec 2023
          </div>
        </div>
        <div class="flex flex-col gap-3 mb-3">
          <h1 class="font-extrabold text-[1.4em] hover:text-[#f4d04e] cursor-pointer transition-all">
            HTML & CSS foundations
          </h1>
          <div class="text-[0.93rem] text-[#6b6b6b] font-medium">
            These languages are the backbone of every website, defining structure, content and presentation.
          </div>
        </div>
        <div>
          <div class="flex items-center gap-3 mb-1">
            <img src="assets/images/image-avatar.webp" width="30px">
            <div class="text-[0.95rem] font-extrabold">
              Greg Hooper
            </div>
          </div>
        </div>
      </div>
    </div>


    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
      Coded by <a href="#">Denis Soboslai</a>.
    </div>
  </main>
</body>
</html>
